<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Supernormal stimulus diagram</title>
  <desc id="desc">A diagram showing natural cues and a beer bottle supernormal stimulus feeding the same decision policy, producing an evolutionary trap.</desc>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="40" y="40" width="1120" height="720" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="600" y="115" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">Supernormal Stimulus Trap</text>
  <text x="600" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#526070">When an artificial cue hits an old policy harder than the natural target</text>

  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#365fa8"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#a33d4a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="105" y="250" width="265" height="150" rx="18" fill="#eef7ee" stroke="#4b7f52" stroke-width="3"/>
    <text x="237.5" y="305" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#1f3323">Natural Cue</text>
    <text x="237.5" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#334d38">female beetle</text>
    <text x="237.5" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4d624f">brown, glossy, textured</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="105" y="485" width="265" height="150" rx="18" fill="#fff1d6" stroke="#9a6b1d" stroke-width="3"/>
    <text x="237.5" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#3a2a0c">Beer Bottle</text>
    <text x="237.5" y="570" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#a33d4a">Supernormal Stimulus</text>
    <text x="237.5" y="607" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#704f18">larger, glossier, textured</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="468" y="368" width="275" height="150" rx="18" fill="#e7efff" stroke="#4d6fb3" stroke-width="3"/>
    <text x="605.5" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#16213f">Decision Policy</text>
    <text x="605.5" y="464" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#283b70">approach the strongest</text>
    <text x="605.5" y="493" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#283b70">mate-like signal</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="368" width="260" height="150" rx="18" fill="#ffe4e6" stroke="#a33d4a" stroke-width="3"/>
    <text x="965" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#3a1419">Trap</text>
    <text x="965" y="464" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5d1f28">reward cue succeeds</text>
    <text x="965" y="493" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5d1f28">while the goal fails</text>
  </g>

  <path d="M370 325 C415 325 425 400 468 420" fill="none" stroke="#365fa8" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <path d="M370 560 C420 560 425 485 468 465" fill="none" stroke="#a33d4a" stroke-width="7" marker-end="url(#arrow-red)"/>
  <path d="M743 443 C780 443 800 443 835 443" fill="none" stroke="#a33d4a" stroke-width="7" marker-end="url(#arrow-red)"/>

  <text x="423" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#365fa8">ordinary signal</text>
  <text x="386" y="606" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#a33d4a">supernormal signal</text>
  <text x="789" y="414" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#a33d4a">misdirected action</text>

  <rect x="112" y="682" width="976" height="40" rx="20" fill="#f1f5f9"/>
  <text x="600" y="709" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">Alignment question: can an optimizer avoid manufacturing perfect bottles for human reward systems?</text>
</svg>
