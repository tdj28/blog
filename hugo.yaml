baseURL: https://www.tdj28.org
title: TDJ28
theme: blowfish
timeout: 120s

languageCode: en-us
defaultContentLanguage: en

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

taxonomies:
  tag: tags
  category: categories
  author: authors
  series: series

author:
  name: "TJ"
  headline: "Data Science | Physics | Math | Engineering"
  bio: "Technical notes and deep dives."
  links:
    - icon: github
      link: "https://github.com/tdj28"
    - icon: twitter
      link: "https://x.com/tdj11100"
    - icon: rss
      link: "/index.xml"

params:
  colorScheme: blowfish
  defaultAppearance: light # valid options: light, dark, auto
  autoSwitchAppearance: true
  keywords: []

  header:
    layout: fixed

  footer:
    showMenu: true
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: profile # profile, page, hero, background, custom
    showRecent: true
    cardView: true
    cardViewScreenWidth: false

  article:
    showDate: true
    showViews: false
    showReadingTime: true
    showTableOfContents: true
    showRelatedContent: true
    relatedContentLimit: 5
    showAuthor: true
    showWordCount: true
    showShare: true
    showTaxonomies: true
    showMermaid: true
    showMath: true

  list:
    showSummary: true
    showDate: true
    showReadTime: true
    showTaxonomies: true

  # Custom Assets
  customCSS: ["css/custom.css"]
  customJS: ["js/tabs.js"]


markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: dracula
    guessSyntax: true
  tableOfContents:
    endLevel: 2
    startLevel: 2

module:
  hugoVersion:
    extended: true
    min: 0.110.0
